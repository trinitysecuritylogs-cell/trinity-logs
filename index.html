<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Note: previously had Cache-Control: no-cache meta tags here.
       Removed because the service worker (sw.js) now owns caching. -->
  <title>Trinity Daily Log</title>

  <!-- PWA — manifest + iOS install metadata. -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1f4e79">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Trinity Log">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%231f4e79'/%3E%3Ctext x='50%25' y='54%25' font-family='Arial,Helvetica,sans-serif' font-size='34' font-weight='700' fill='white' text-anchor='middle' dominant-baseline='middle'%3ET%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --trinity-blue: #1f4e79;
      --trinity-blue-bg: #eaf1f8;
      --line: #b8c6d6;
      --text: #1a1a1a;
      --error: #b00020;
      --muted: #6b6b6b;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      color: var(--text);
      background: #fff;
      padding: 40px 20px;
    }
    .card {
      max-width: 560px;
      width: 100%;
      margin: 0 auto;
      padding: 32px 36px;
      background: var(--trinity-blue-bg);
      border-radius: 8px;
      text-align: center;
    }
    h1 {
      margin: 0 0 4px;
      color: var(--trinity-blue);
      font-size: 24px;
    }
    h2 {
      margin: 0 0 28px;
      color: var(--trinity-blue);
      font-size: 18px;
      font-weight: 600;
    }
    label {
      display: block;
      font-size: 14px;
      color: var(--trinity-blue);
      font-weight: 600;
      margin-bottom: 6px;
      text-align: left;
    }
    .hint {
      font-size: 12px;
      color: var(--muted);
      font-weight: 400;
      margin-left: 6px;
    }
    .email-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    input[type="email"] {
      flex: 1;
      padding: 14px;
      font-size: 17px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff;
      color: var(--text);
      min-width: 0;
    }
    input[type="email"]:focus {
      outline: none;
      border-color: var(--trinity-blue);
      box-shadow: 0 0 0 2px rgba(31, 78, 121, 0.18);
    }
    .add-btn {
      background: #fff;
      color: var(--trinity-blue);
      border: 1px solid var(--trinity-blue);
      padding: 0 18px;
      font-size: 17px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      min-width: 72px;
    }
    .add-btn:hover { background: #dde8f3; }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0 20px;
      min-height: 4px;
      text-align: left;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 8px 4px 8px 14px;
      background: #fff;
      border: 1px solid var(--trinity-blue);
      color: var(--trinity-blue);
      border-radius: 999px;
      font-size: 15px;
      font-weight: 500;
      max-width: 100%;
    }
    .chip-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 360px;
    }
    .chip-remove {
      background: transparent;
      border: 0;
      color: var(--trinity-blue);
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      padding: 2px 10px;
      border-radius: 999px;
    }
    .chip-remove:hover { background: var(--trinity-blue-bg); }
    button.start {
      width: 100%;
      background: var(--trinity-blue);
      color: #fff;
      border: 0;
      padding: 16px;
      font-size: 18px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }
    button.start:hover { background: #173b5c; }
    button.start:disabled { background: #95a8bd; cursor: not-allowed; }
    .error {
      color: var(--error);
      font-size: 14px;
      margin: 4px 0 4px;
      text-align: left;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Trinity Investigations &amp; Security Inc.</h1>
    <h2>Daily Security Officer Log</h2>

    <label for="email">
      Send logs to:
      <span class="hint">(add one or more addresses)</span>
    </label>
    <div class="email-row">
      <input type="email" id="email"
             autocomplete="off"
             autocorrect="off"
             autocapitalize="off"
             spellcheck="false"
             enterkeyhint="done"
             inputmode="email"
             placeholder="manager@example.com">
      <button type="button" class="add-btn" id="addBtn">+ Add</button>
    </div>
    <div class="error" id="error"></div>
    <div class="chips" id="chips" aria-live="polite"></div>

    <button type="button" class="start" id="startBtn">Start</button>
  </div>

  <!-- Version stamp — bump on each push to confirm tablet has latest -->
  <div style="text-align:center; padding:16px 0; color:#999; font-size:11px; font-family:monospace;">
    Landing v2026-05-24-v2
  </div>

  <script>
    // -------------------------------------------------------
    //  HR9 — Kill switch.
    //  Visiting either page with ?reset=1 wipes every form of local
    //  state (service worker, caches, IndexedDB, localStorage) and
    //  reloads cleanly. This is the customer's escape hatch when the
    //  cached app is broken and they can't open devtools on the tablet.
    // -------------------------------------------------------
    (async function maybeKillSwitch() {
      if (!new URLSearchParams(location.search).has('reset')) return;
      document.documentElement.innerHTML =
        '<body style="font-family:sans-serif;padding:40px;text-align:center">' +
        '<h2>Resetting&hellip;</h2><p>Clearing cache and local data.</p></body>';
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((r) => r.unregister()));
        }
        if ('caches' in window) {
          const names = await caches.keys();
          await Promise.all(names.map((n) => caches.delete(n)));
        }
        try { await indexedDB.deleteDatabase('TrinityDailyLog'); } catch (e) {}
        try { localStorage.clear(); } catch (e) {}
      } finally {
        location.replace(location.origin + location.pathname);
      }
    })();

    // -------------------------------------------------------
    //  Service Worker registration. Lives at the repo root so its
    //  scope covers both index.html and Form.html.
    // -------------------------------------------------------
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch((err) => {
          console.warn('[trinity] SW registration failed:', err);
        });
      });
    }

    // -------------------------------------------------------
    //  CONFIG  — change these two if your setup changes
    // -------------------------------------------------------
    // Cloudflare Worker that relays to Apps Script. This is where every
    // POST from this page goes — it forwards to the Apps Script doGet
    // (because Apps Script doPost is currently broken at the platform
    // level for many accounts, as of late 2025).
    const WORKER_URL = 'https://daily-log-relay.trinitysecuritylogs.workers.dev/';

    // Where to send the user after they pick recipients. Relative path
    // since both files are served from the same GitHub Pages origin.
    const FORM_URL = 'Form.html';

    // On first load, try to pre-populate recipients from a list saved
    // locally. We can't reach Apps Script for the last-saved list
    // anymore (that needed the iframe template variables), so the
    // tablet now remembers it locally via localStorage.
    //
    // Wrapped in try/catch: Safari's private-browsing mode (and some
    // locked-down WebViews) throw on localStorage access. We'd rather
    // start with an empty chip list than crash the whole page.
    let INITIAL_EMAILS = '';
    try {
      INITIAL_EMAILS = localStorage.getItem('trinity:lastEmails') || '';
    } catch (e) {
      console.warn('[trinity] localStorage read failed:', e);
    }

    const emailInput = document.getElementById('email');
    const addBtn     = document.getElementById('addBtn');
    const startBtn   = document.getElementById('startBtn');
    const errorEl    = document.getElementById('error');
    const chipsEl    = document.getElementById('chips');

    const recipients = [];

    function isValidEmail(s) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);
    }

    function renderChips() {
      chipsEl.innerHTML = '';
      recipients.forEach((addr, idx) => {
        const chip = document.createElement('span');
        chip.className = 'chip';
        const text = document.createElement('span');
        text.className = 'chip-text';
        text.textContent = addr;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'chip-remove';
        btn.setAttribute('aria-label', 'Remove ' + addr);
        btn.textContent = '\u00d7'; // multiplication sign — used as X
        btn.addEventListener('click', () => {
          recipients.splice(idx, 1);
          renderChips();
        });
        chip.appendChild(text);
        chip.appendChild(btn);
        chipsEl.appendChild(chip);
      });
    }

    function addEmail() {
      const raw = (emailInput.value || '').trim();
      if (!raw) {
        errorEl.textContent = 'Type an email, then tap Add.';
        emailInput.focus();
        return false;
      }
      const candidates = raw.split(/[,;\s]+/).map(s => s.trim()).filter(Boolean);

      // Validate ALL candidates before adding any. Avoids the case where a
      // paste of "good@x.com, bad" silently adds the good one but never
      // re-renders the chip list (because we returned early on the bad one).
      const bad = candidates.filter(addr => !isValidEmail(addr));
      if (bad.length) {
        errorEl.textContent = 'Not a valid email: ' + bad.join(', ');
        emailInput.focus();
        return false;
      }

      const dupes = [];
      const added = [];
      candidates.forEach(addr => {
        const lower = addr.toLowerCase();
        if (recipients.some(r => r.toLowerCase() === lower)) {
          dupes.push(addr);
        } else {
          recipients.push(addr);
          added.push(addr);
        }
      });
      if (!added.length && dupes.length) {
        errorEl.textContent = 'Already added: ' + dupes.join(', ');
      } else {
        errorEl.textContent = '';
      }
      emailInput.value = '';
      renderChips();
      emailInput.focus();
      return added.length > 0;
    }

    // ----------------------------------------------------------------
    //  go() — handler for the Start button.
    //
    //  Per SPEC-landing-offline-addendum (HR1-HR5): the Landing page
    //  must NEVER block the officer from reaching Form.html. Offline,
    //  unstable WiFi, dead Worker — none of those can keep them on
    //  this page. The chain is:
    //
    //    1. Local validation (non-empty recipients, valid format).
    //       This is the ONLY thing that can prevent navigation.
    //    2. Save recipients to localStorage so the chips
    //       pre-populate next session.  (HR2)
    //    3. Fire a best-effort POST to the Worker to sync the
    //       recipient list to PropertiesService.  (HR3)
    //       - keepalive:true lets the request outlive the navigation
    //         we trigger in step 4, so we get the server sync for
    //         free without making the officer wait for it.
    //       - Failures (offline, timeout, 5xx, JSON garbage) are
    //         swallowed — see HR4.
    //    4. Navigate to Form.html, regardless of step 3's outcome.
    //       (HR1)
    //
    //  We deliberately do NOT show a "Loading\u2026" spinner anymore
    //  (Option A in the spec). The navigation is effectively
    //  instant, so a spinner would just be a lie offline.
    // ----------------------------------------------------------------
    function go() {
      // If the user typed something but forgot to tap Add, fold it in now.
      if ((emailInput.value || '').trim()) {
        addEmail();
        if (errorEl.textContent) return;
      }
      if (!recipients.length) {
        errorEl.textContent = 'Add at least one email address.';
        emailInput.focus();
        return;
      }
      errorEl.textContent = '';

      // Guard against double-tap. We don't re-enable because the very
      // next line begins a navigation that destroys this page.
      if (startBtn.disabled) return;
      startBtn.disabled = true;

      // HR2 — ALWAYS persist locally before navigating away. Wrapped
      // because localStorage can throw (quota exceeded, private mode,
      // locked-down WebView). A failed save here is unfortunate but
      // must not block the officer.
      try {
        localStorage.setItem('trinity:lastEmails', recipients.join(','));
      } catch (e) {
        console.warn('[trinity] localStorage write failed:', e);
      }

      // HR3 / HR4 — Best-effort server sync. keepalive:true tells the
      // browser to keep the POST in flight even after we navigate away
      // a few lines down. We don't await it: the network result, if
      // any, never reaches this page's JS (we're gone). Errors thrown
      // synchronously by fetch() (extremely rare) are caught so they
      // can't trip the navigation.
      try {
        fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'saveLastEmails',
            emails: recipients
          }),
          keepalive: true
        }).catch((err) => {
          // Promise rejection lands here when offline / DNS fails /
          // CORS blocks / etc. Log only — HR4 says non-blocking.
          console.warn('[trinity] email sync failed (offline?):', err);
        });
      } catch (err) {
        console.warn('[trinity] could not start email sync:', err);
      }

      // HR1 — Always navigate. Relative URL so it works inside the
      // PWA scope (and is precached by sw.js for offline use).
      window.location.href = FORM_URL;
    }

    addBtn.addEventListener('click', addEmail);
    startBtn.addEventListener('click', go);
    emailInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        addEmail();
      }
    });

    // ----------------------------------------------------------------
    //  NTH1 — Offline indicator.
    //
    //  Subtle gray note above the Start button, shown only when
    //  navigator.onLine reports false. This honors HR5 ("don't lie to
    //  the officer"): if their changes won't reach the server right
    //  now, say so plainly. The wording avoids alarm — Start still
    //  works, the recipient list just defers to next online session.
    //
    //  navigator.onLine is famously unreliable (it can say "true" on
    //  a captive-portal WiFi with no real upstream), so we treat this
    //  as best-effort: when it says we're offline, it usually is;
    //  when it says we're online, the keepalive fetch in go() is the
    //  real test. The note responds to live online/offline events so
    //  it appears the moment connectivity drops while the officer is
    //  still on this page.
    // ----------------------------------------------------------------
    const offlineNote = document.createElement('div');
    offlineNote.id = 'offlineNote';
    offlineNote.setAttribute('role', 'status');
    offlineNote.setAttribute('aria-live', 'polite');
    offlineNote.style.cssText =
      'font-size:12px; color:#6b6b6b; margin:0 0 10px; text-align:center;';
    offlineNote.textContent =
      'Offline — recipient list will sync when you have Wi-Fi.';
    offlineNote.hidden = true;
    startBtn.parentNode.insertBefore(offlineNote, startBtn);

    function updateOfflineNote() {
      // navigator.onLine === false is the only safe "definitely offline"
      // signal. true / undefined both mean "maybe online, don't claim".
      offlineNote.hidden = navigator.onLine !== false;
    }
    updateOfflineNote();
    window.addEventListener('online',  updateOfflineNote);
    window.addEventListener('offline', updateOfflineNote);

    // Seed chips from the last saved session
    if (INITIAL_EMAILS) {
      INITIAL_EMAILS.split(/[,;\s]+/)
        .map(s => s.trim())
        .filter(Boolean)
        .forEach(addr => {
          if (isValidEmail(addr) &&
              !recipients.some(r => r.toLowerCase() === addr.toLowerCase())) {
            recipients.push(addr);
          }
        });
      renderChips();
    }
  </script>
</body>
</html>
