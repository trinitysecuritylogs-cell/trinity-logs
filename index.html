<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keyboard Test</title>
<style>
  body { font-family: sans-serif; padding: 40px 20px; }
  h1 { color: #1f4e79; }
  input { width: 100%; padding: 16px; font-size: 18px; box-sizing: border-box; }
  .count { font-size: 48px; color: #1f4e79; margin: 20px 0; }
  .log { background: #eaf1f8; padding: 12px; border-radius: 4px; font-family: monospace; font-size: 13px; min-height: 80px; }
  button { padding: 12px 20px; margin-top: 12px; font-size: 16px; }
</style>
</head>
<body>
  <h1>Keyboard dismiss test</h1>
  <p>Tap the input. Type 10+ characters slowly. Watch the counter — if the keyboard dismisses, the counter tells you at which keystroke.</p>
  
  <input type="text" id="testInput" placeholder="Type here...">
  <div class="count" id="counter">0 keystrokes</div>
  
  <p>Event log (newest at top):</p>
  <div class="log" id="log"></div>
  
  <button onclick="document.getElementById('log').innerHTML=''; document.getElementById('counter').textContent='0 keystrokes';">Clear</button>
  
  <script>
    let count = 0;
    const input = document.getElementById('testInput');
    const counter = document.getElementById('counter');
    const log = document.getElementById('log');
    
    function logEvent(name) {
      const time = new Date().toISOString().substr(14, 9);
      log.innerHTML = '[' + time + '] ' + name + '<br>' + log.innerHTML;
    }
    
    input.addEventListener('input', () => {
      count++;
      counter.textContent = count + ' keystrokes';
      logEvent('input: "' + input.value + '"');
    });
    input.addEventListener('focus', () => logEvent('FOCUS gained'));
    input.addEventListener('blur', () => logEvent('BLUR — keyboard probably just dismissed'));
  </script>
</body>
</html>
